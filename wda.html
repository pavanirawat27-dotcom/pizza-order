<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            text-align: center;
        }
        .order-form {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #d9534f;
        }
        .form-section {
            text-align: left;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }
        .form-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .button-group {
            text-align: center;
            margin-top: 20px;
        }
        .button-group input {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 5px;
        }
        .submit-btn {
            background-color: #5cb85c;
            color: white;
        }
        .reset-btn {
            background-color: #f0ad4e;
            color: white;
        }
    </style>
</head>
<body>
 
    <div class="order-form">
        <h1>🍕 My Pizza Order</h1>
        <form>
            <div class="form-section">
                <label>Order Type:</label>
                <input type="radio" id="delivery" name="orderType" value="delivery" checked>
                <label for="delivery">Delivery</label><br>
                <input type="radio" id="pickup" name="orderType" value="pickup">
                <label for="pickup">Pickup</label>
            </div>
 
            <div class="form-section">
                <label>Choose Toppings:</label>
                <input type="checkbox" id="pepperoni" name="topping" value="pepperoni">
                <label for="pepperoni">Pepperoni</label><br>
                <input type="checkbox" id="mushrooms" name="topping" value="mushrooms">
                <label for="mushrooms">Mushrooms</label><br>
                <input type="checkbox" id="onions" name="topping" value="onions">
                <label for="onions">Onions</label><br>
                <input type="checkbox" id="olives" name="topping" value="olives">
                <label for="olives">Olives</label>
            </div>
 
            <div class="button-group">
                <input type="submit" value="Submit Order" class="submit-btn">
                <input type="reset" value="Reset" class="reset-btn">
            </div>
        </form>
    </div>
 
</body>
</html>
